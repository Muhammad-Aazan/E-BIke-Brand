version: '3.8'

services:
  # ==========================================================
  # EVee Express API Backend
  # ==========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evee_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/evee_db
      - MONGODB_DB_NAME=evee_db
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_in_production_minimum_64_characters_long_secret_key_12345}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_in_production_minimum_64_characters_long_refresh_secret_key}
      - COOKIE_SECRET=${COOKIE_SECRET:-dev_cookie_secret_change_in_production}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-stripe}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-pkr}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evee_network

  # ==========================================================
  # MongoDB Database Service
  # ==========================================================
  mongodb:
    image: mongo:7.0
    container_name: evee_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - evee_mongodb_data:/data/db
    networks:
      - evee_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================
  # Redis Cache & Rate Limiting Service
  # ==========================================================
  redis:
    image: redis:7.2-alpine
    container_name: evee_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - evee_redis_data:/data
    networks:
      - evee_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evee_mongodb_data:
    driver: local
  evee_redis_data:
    driver: local

networks:
  evee_network:
    driver: bridge
